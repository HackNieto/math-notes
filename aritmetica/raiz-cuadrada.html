<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raíz cuadrada paso a paso</title>
<style>
:root{
  --paper:#fdfdfb; --grid:#dbe7f3; --ink:#1f3a68; --soft:#5a6b85;
  --pen:#c8323a; --ok:#1f8a4c; --hl:#fff3a8; --card:#ffffffd9; --line:#b9cbe0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141a24; --grid:#1f2a3a; --ink:#dbe6f7; --soft:#93a3bb;
    --pen:#ff7a80; --ok:#5fd394; --hl:#4a4320; --card:#182131e6; --line:#2f3f57;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141a24; --grid:#1f2a3a; --ink:#dbe6f7; --soft:#93a3bb;
  --pen:#ff7a80; --ok:#5fd394; --hl:#4a4320; --card:#182131e6; --line:#2f3f57;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:1.05rem; line-height:1.55;
  font-variant-numeric: tabular-nums;
}
main{max-width:720px; margin:0 auto; padding:24px 18px 64px}
.volver{display:inline-block; color:var(--ink); font-weight:600; text-decoration:none; padding:6px 0; border-bottom:2px solid var(--line)}
.volver:hover{border-bottom-color:var(--pen)}
.volver:focus-visible{outline:3px solid var(--pen); outline-offset:3px}
h1{
  font-family: Georgia, "Times New Roman", serif;
  font-size:clamp(1.9rem,6vw,2.6rem); line-height:1.1; margin:8px 0 6px; font-weight:700;
}
.sub{color:var(--soft); margin:0 0 22px}
.panel{background:var(--card); border:2px solid var(--ink); border-radius:14px; padding:14px 16px}
.entrada{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.radical{font-family:Georgia,serif; font-size:2.6rem; line-height:1; display:flex; align-items:stretch}
.radical span.sym{padding-right:2px}
.radical input{
  font:inherit; font-size:2.2rem; width:5.5ch; color:var(--ink); background:transparent;
  border:none; border-top:3px solid var(--ink); padding:2px 6px 0; outline:none;
}
.radical input:focus-visible{background:var(--hl)}
button{
  font:inherit; font-weight:600; cursor:pointer; border-radius:10px;
  border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:10px 18px;
}
button:focus-visible, select:focus-visible{outline:3px solid var(--pen); outline-offset:2px}
.metodo{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line)}
.metodo label{display:block; font-weight:600; margin-bottom:6px}
select{
  font:inherit; width:100%; color:var(--ink); background:var(--paper);
  border:2px solid var(--ink); border-radius:10px; padding:8px 10px;
}
.desc{color:var(--soft); font-size:.95rem; margin:8px 0 0}
.ejemplos{margin:12px 0 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--soft); font-size:.95rem}
.ejemplos button{background:transparent; color:var(--ink); padding:4px 12px; font-weight:500; border-width:1.5px}
.error{color:var(--pen); font-weight:600; margin-top:16px}
ol.pasos{list-style:none; padding:0; margin:28px 0 0; counter-reset:paso}
ol.pasos > li{
  counter-increment:paso; position:relative;
  background:var(--card); border-left:4px solid var(--ink);
  border-radius:0 12px 12px 0; padding:14px 16px 14px 56px; margin-bottom:16px;
}
ol.pasos > li::before{
  content:counter(paso); position:absolute; left:14px; top:12px;
  width:30px; height:30px; border-radius:50%; border:2px solid var(--pen); color:var(--pen);
  display:grid; place-items:center; font-weight:700; font-family:Georgia,serif;
}
ol.pasos > li.aviso{border-left-color:var(--pen)}
ol.pasos h2{font-size:1.1rem; margin:2px 0 6px}
ol.pasos p{margin:6px 0}
.cuenta{
  font-family:Georgia,serif; font-size:1.15rem; background:var(--hl);
  display:inline-block; padding:2px 8px; border-radius:6px; margin:4px 0;
}
.pista{color:var(--soft); font-size:.95rem}
.dibujo{margin:14px 0 4px; overflow-x:auto}
.dibujo svg{display:block; width:100%; min-width:300px; height:auto}
table{border-collapse:collapse; width:100%; font-size:.98rem}
.tabla{overflow-x:auto; margin-top:8px}
th,td{padding:6px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th{color:var(--soft); font-weight:600}
th:first-child,td:first-child{text-align:center}
td.izq{text-align:left}
tr.salto td{text-align:center; color:var(--soft)}
tr.no td{color:var(--pen)}
.resultado{margin-top:8px; border:2px solid var(--ok); border-radius:14px; padding:16px; background:var(--card)}
.resultado .grande{font-family:Georgia,serif; font-size:2.2rem; font-weight:700; color:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  ol.pasos > li{animation:aparece .35s ease both}
  @keyframes aparece{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<main>
  <a class="volver" href="../index.html">← Volver al menú</a>
  <h1>Raíz cuadrada paso a paso</h1>
  <p class="sub">Escribe un número, elige un método y mira cómo se calcula su raíz.</p>

  <div class="panel">
    <div class="entrada">
      <label class="radical" for="num" aria-label="Número"><span class="sym" aria-hidden="true">√</span><input id="num" inputmode="decimal" value="59" autocomplete="off"></label>
      <button id="calc">Calcular</button>
    </div>
    <div class="metodo">
      <label for="metodo">Método</label>
      <select id="metodo">
        <option value="babilonico" selected>Babilónico (promedios)</option>
        <option value="tanteo">Tanteo por mitades</option>
        <option value="impares">Restas de números impares</option>
        <option value="tradicional">Método tradicional a mano (la casita)</option>
        <option value="factorizacion">Factorización en primos</option>
        <option value="aproximacion">Fórmula rápida (cuadrado más cercano)</option>
        <option value="geometrico">Con regla y compás (geometría)</option>
      </select>
      <p class="desc" id="desc"></p>
    </div>
  </div>
  <div class="ejemplos">Prueba con:
    <button data-v="59">59</button><button data-v="2">2</button><button data-v="72">72</button><button data-v="144">144</button><button data-v="0,5">0,5</button><button data-v="1000">1000</button>
  </div>

  <div id="salida" aria-live="polite"></div>
</main>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const fmt = (x, d=4) => Number(x).toLocaleString('es-ES', {maximumFractionDigits:d, useGrouping:false});

  const DESC = {
    babilonico: 'Partes de un número parecido a la raíz y lo vas mejorando con divisiones y promedios. Es rápido y muy preciso.',
    tanteo: 'Pruebas el número que está a la mitad del camino, ves si se pasa o no llega, y repites. Solo necesitas saber multiplicar.',
    impares: 'Le restas 1, 3, 5, 7… al número hasta que ya no se pueda. Contar las restas te da la raíz sin decimales.',
    tradicional: 'El método que se hacía con lápiz y papel antes de las calculadoras. Saca la raíz cifra por cifra, parecido a una división.',
    factorizacion: 'Separas el número en multiplicaciones de números primos. Sirve para raíces exactas o para simplificarlas, como √72 = 6√2.',
    aproximacion: 'Una fórmula para calcular de cabeza usando el cuadrado perfecto más cercano.',
    geometrico: 'Dibujas media circunferencia con regla y compás, y una línea dentro de ella mide justo la raíz.'
  };

  // ---------- piezas comunes ----------
  function paso(titulo, cuerpo, clase=''){
    return `<li${clase ? ` class="${clase}"` : ''}><h2>${titulo}</h2>${cuerpo}</li>`;
  }
  function resultado(n, valor, simbolo, extra=''){
    return `<div class="resultado"><div>√${fmt(n)} ${simbolo}</div><div class="grande">${valor}</div>
      ${extra}<div class="pista">La calculadora da ${fmt(Math.sqrt(n),6)}.</div></div>`;
  }
  function esPerfecto(n){
    const a = Math.round(Math.sqrt(n));
    return a*a === n ? a : null;
  }
  function htmlPerfecto(n, a){
    return '<ol class="pasos">' + paso('¿Es un cuadrado perfecto?',
      `<p>Buscamos un número que multiplicado por sí mismo dé ${fmt(n)}:</p>
       <p><span class="cuenta">${a} × ${a} = ${fmt(n)}</span></p>
       <p>¡Sí! ${fmt(n)} es un cuadrado perfecto, así que su raíz es exacta.</p>`) +
      '</ol>' + resultado(n, a, '=');
  }
  function recta(n, a){
    const b = a + 1, a2 = a*a, b2 = b*b;
    const t = (n - a2) / (b2 - a2);
    const x0 = 30, x1 = 370, px = x0 + t*(x1-x0);
    return `<div class="dibujo"><svg viewBox="0 0 400 90" role="img" aria-label="${fmt(n)} está entre ${a2} y ${b2}">
      <line x1="${x0}" y1="45" x2="${x1}" y2="45" stroke="currentColor" stroke-width="3"/>
      <line x1="${x0}" y1="35" x2="${x0}" y2="55" stroke="currentColor" stroke-width="3"/>
      <line x1="${x1}" y1="35" x2="${x1}" y2="55" stroke="currentColor" stroke-width="3"/>
      <text x="${x0}" y="78" text-anchor="middle" fill="currentColor" font-size="15">${a2} = ${a}²</text>
      <text x="${x1}" y="78" text-anchor="middle" fill="currentColor" font-size="15">${b2} = ${b}²</text>
      <circle cx="${px}" cy="45" r="8" style="fill:var(--pen)"/>
      <text x="${px}" y="22" text-anchor="middle" style="fill:var(--pen)" font-size="16" font-weight="700">${fmt(n)}</text>
    </svg></div>`;
  }
  function pasoVecinos(n){
    const a = Math.floor(Math.sqrt(n) + 1e-12), b = a+1;
    return paso('Busca los cuadrados perfectos vecinos',
      `<p>Un cuadrado perfecto es lo que da un número entero multiplicado por sí mismo, como 9 = 3 × 3 o 49 = 7 × 7. Los que quedan justo antes y justo después de ${fmt(n)} son:</p>
       <p><span class="cuenta">${a}² = ${a*a}</span> &nbsp; y &nbsp; <span class="cuenta">${b}² = ${b*b}</span></p>
       <p>Como ${fmt(n)} está entre ${a*a} y ${b*b}, su raíz está <strong>entre ${a} y ${b}</strong>. O sea, la raíz es ${a} coma algo.</p>${recta(n, a)}`);
  }
  function pasoComprobar(n, x){
    const r2 = Math.round(x*100)/100;
    return paso('Comprueba multiplicando',
      `<p>Si la raíz es correcta, al multiplicarla por sí misma debe dar casi ${fmt(n)}:</p>
       <p><span class="cuenta">${fmt(r2,2)} × ${fmt(r2,2)} = ${fmt(r2*r2,4)}</span></p>
       <p class="pista">No da exacto porque redondeamos a dos decimales; esta raíz tiene infinitos decimales.</p>`);
  }

  // ---------- métodos ----------
  function babilonico(n){
    const p = esPerfecto(n); if (p !== null) return htmlPerfecto(n, p);
    const a = Math.floor(Math.sqrt(n)), a2 = a*a, b2 = (a+1)*(a+1);
    const dist = n - a2, tramo = b2 - a2, est = a + dist / tramo;
    const cerca = (n - a2) < (b2 - n) ? a : a+1;
    let h = '<ol class="pasos">' + pasoVecinos(n);
    h += paso('Haz una primera estimación',
      `<p>Ya sabemos que la raíz es ${a} coma algo. Para adivinar ese “algo”, imagina que caminas de ${a2} a ${b2} y ves qué tanto del camino ya recorrió ${fmt(n)}.</p>
       <p><strong>a) ¿Cuánto mide todo el camino?</strong> De ${a2} a ${b2}:<br><span class="cuenta">${b2} − ${a2} = ${tramo}</span></p>
       <p><strong>b) ¿Cuánto ya avanzó ${fmt(n)}?</strong> De ${a2} a ${fmt(n)}:<br><span class="cuenta">${fmt(n)} − ${a2} = ${fmt(dist)}</span></p>
       <p><strong>c) ¿Qué parte del camino es?</strong> Dividimos lo que avanzó entre lo que mide todo el camino:<br><span class="cuenta">${fmt(dist)} ÷ ${tramo} ≈ ${fmt(Math.round(dist/tramo*1000)/1000,3)}</span></p>
       <p class="pista">¿Por qué ${fmt(dist)} ÷ ${tramo} y no ${tramo} ÷ ${fmt(dist)}? Es como leer un libro: si llevas ${fmt(dist)} páginas de ${tramo}, has leído ${fmt(dist)} ÷ ${tramo} del libro. Siempre va primero lo que avanzaste y después el total. Al revés te daría ${fmt(tramo/dist,2)}, más de un camino completo, y la raíz se saldría de entre ${a} y ${a+1}.</p>
       <p><strong>d) Súmalo a ${a}:</strong><br><span class="cuenta">${a} + ${fmt(Math.round(dist/tramo*1000)/1000,3)} = ${fmt(a + Math.round(dist/tramo*1000)/1000,3)}</span></p>
       <p class="pista">Todo junto se escribe ${a} + ${fmt(dist)} ÷ ${tramo}. Ojo con el orden: primero se hace la división y después la suma, porque en matemáticas las divisiones y multiplicaciones van antes que las sumas y restas.</p>
       <p class="pista">Fíjate: ${fmt(n)} está más cerca de ${cerca*cerca}, por eso la estimación queda más cerca de ${cerca}.</p>`);
    let x = est, filas = '', it = 0, prev;
    do {
      prev = x; const q = n / x, nx = (x + q) / 2; it++;
      filas += `<tr><td>${it}</td><td>${fmt(x,6)}</td><td>${fmt(q,6)}</td><td><strong>${fmt(nx,6)}</strong></td></tr>`;
      x = nx;
    } while (Math.abs(x - prev) > 1e-7 * Math.max(1, x) && it < 8);
    const q1 = n / est, x1 = (est + q1)/2;
    h += paso('Mejora con promedios',
      `<p>Piensa así: si ${fmt(est,3)} fuera la raíz exacta, al dividir ${fmt(n)} entre ${fmt(est,3)} saldría otra vez ${fmt(est,3)}. Como sale otro número, la raíz verdadera está entre los dos. Su promedio (la mitad del camino entre ellos) es una mejor respuesta.</p>
       <p><span class="cuenta">${fmt(n)} ÷ ${fmt(est,6)} ≈ ${fmt(q1,6)}</span></p>
       <p><span class="cuenta">(${fmt(est,6)} + ${fmt(q1,6)}) ÷ 2 ≈ ${fmt(x1,6)}</span></p>
       <p>Ahora repetimos lo mismo con el número nuevo. Cada vuelta acierta más decimales, y paramos cuando el resultado ya no cambia:</p>
       <div class="tabla"><table><thead><tr><th>Vuelta</th><th>Tu número</th><th>${fmt(n)} ÷ tu número</th><th>Promedio de los dos</th></tr></thead>
       <tbody>${filas}</tbody></table></div>
       <p class="pista">${it === 1 ? 'Con una sola vuelta ya es muy preciso.' : `En ${it} vueltas el resultado dejó de cambiar.`}</p>`);
    h += pasoComprobar(n, x) + '</ol>';
    return h + resultado(n, fmt(x,4), '≈');
  }

  function tanteo(n){
    const p = esPerfecto(n); if (p !== null) return htmlPerfecto(n, p);
    let lo = Math.floor(Math.sqrt(n)), hi = lo + 1;
    let h = '<ol class="pasos">' + pasoVecinos(n);
    const m0 = (lo+hi)/2;
    h += paso('Prueba el punto medio',
      `<p>Probamos el número que está justo a la mitad entre ${lo} y ${hi}, y lo multiplicamos por sí mismo:</p>
       <p><span class="cuenta">${fmt(m0)} × ${fmt(m0)} = ${fmt(m0*m0)}</span></p>
       <p>${m0*m0 > n ? `Se pasa de ${fmt(n)}, así que la raíz está entre ${lo} y ${fmt(m0)}.` : `No llega a ${fmt(n)}, así que la raíz está entre ${fmt(m0)} y ${hi}.`}
       Ya no hace falta buscar en la otra mitad.</p>`);
    let filas = '', it = 0;
    while (hi - lo > 0.005 && it < 12){
      it++;
      const m = (lo+hi)/2, m2 = m*m, grande = m2 > n;
      filas += `<tr><td>${it}</td><td>${fmt(lo,4)} y ${fmt(hi,4)}</td><td>${fmt(m,4)}</td><td>${fmt(m2,4)}</td><td class="izq">${grande ? 'se pasa' : 'no llega'}</td></tr>`;
      if (grande) hi = m; else lo = m;
    }
    const x = (lo+hi)/2;
    h += paso('Repite hasta acorralar la raíz',
      `<p>En cada vuelta probamos la mitad del nuevo tramo. Así, el espacio donde se esconde la raíz se hace cada vez más pequeño:</p>
       <div class="tabla"><table><thead><tr><th>Vuelta</th><th>Entre</th><th>Prueba</th><th>Su cuadrado</th><th>¿Qué pasa?</th></tr></thead>
       <tbody>${filas}</tbody></table></div>
       <p>Ahora la raíz está entre ${fmt(lo,4)} y ${fmt(hi,4)}, así que con dos decimales es <strong>${fmt(Math.round(x*100)/100,2)}</strong>.</p>
       <p class="pista">Es como el juego de adivinar un número cuando te dicen “más alto” o “más bajo”. Es más lento que el babilónico, pero solo necesitas multiplicar.</p>`);
    h += pasoComprobar(n, x) + '</ol>';
    return h + resultado(n, fmt(Math.round(x*100)/100,2), '≈');
  }

  function impares(n){
    let h = '<ol class="pasos">';
    h += paso('Observa el truco',
      `<p>Si sumas números impares seguidos, siempre obtienes un cuadrado perfecto:</p>
       <p><span class="cuenta">1 = 1²</span> &nbsp; <span class="cuenta">1 + 3 = 4 = 2²</span> &nbsp; <span class="cuenta">1 + 3 + 5 = 9 = 3²</span></p>
       <p>Por eso, si a un número le restas 1, 3, 5, 7… mientras se pueda, <strong>la cantidad de restas que hiciste es la raíz sin decimales</strong> (el número antes de la coma).</p>`);
    let resto = n, k = 0, impar = 1, filas = [];
    while (resto - impar >= -1e-9){
      const antes = resto; resto = +(resto - impar).toFixed(10); k++;
      filas.push(`<tr><td>${k}</td><td>${fmt(antes)} − ${impar}</td><td>${fmt(resto)}</td></tr>`);
      impar += 2;
    }
    let mostradas = filas;
    if (filas.length > 14) mostradas = [...filas.slice(0,5), `<tr class="salto"><td colspan="3">… ${filas.length - 8} restas más …</td></tr>`, ...filas.slice(-3)];
    mostradas.push(`<tr class="no"><td>—</td><td>${fmt(resto)} − ${impar}</td><td>ya no se puede</td></tr>`);
    h += paso('Resta impares hasta que no se pueda',
      `<div class="tabla"><table><thead><tr><th>Resta</th><th>Operación</th><th>Queda</th></tr></thead>
       <tbody>${mostradas.join('')}</tbody></table></div>
       <p>Hicimos <strong>${k} restas</strong> y sobraron ${fmt(resto)}. Entonces √${fmt(n)} es <strong>${k}</strong>${resto < 1e-9 ? '' : ' coma algo'}.</p>`);
    if (resto < 1e-9){
      h += '</ol>';
      return h + resultado(n, k, '=', `<div class="pista">No sobró nada: ${fmt(n)} es un cuadrado perfecto.</div>`);
    }
    if (k === 0){
      h += paso('Limitación', `<p>Con números menores que 1 este método no da información útil. Prueba otro método de la lista.</p>`, 'aviso') + '</ol>';
      return h;
    }
    const est = k + resto / impar;
    h += paso('Estima los decimales',
      `<p>Sobraron ${fmt(resto)}, pero para hacer una resta más necesitábamos ${impar}. Es decir, llevamos ${fmt(resto)} de ${impar} del camino hacia ${k+1}. Esa fracción nos da los decimales:</p>
       <p><strong>Primero divide</strong> lo que sobró entre lo que necesitábamos:<br><span class="cuenta">${fmt(resto)} ÷ ${impar} ≈ ${fmt(Math.round(resto/impar*1000)/1000,3)}</span></p>
       <p><strong>Después súmalo</strong> a ${k}:<br><span class="cuenta">${k} + ${fmt(Math.round(resto/impar*1000)/1000,3)} = ${fmt(k + Math.round(resto/impar*1000)/1000,3)}</span></p>
       <p class="pista">Va ${fmt(resto)} ÷ ${impar} y no al revés porque lo que sobró es solo una parte de lo que necesitábamos: el resultado tiene que salir menor que 1.</p>
       <p class="pista">Los decimales son solo una aproximación; el número antes de la coma sí es exacto.</p>`);
    h += pasoComprobar(n, est) + '</ol>';
    return h + resultado(n, fmt(Math.round(est*100)/100,2), '≈');
  }

  function tradicional(n, raw){
    let s = /^\d*\.?\d*$/.test(raw) && raw !== '.' ? raw : n.toFixed(6);
    let [ip, dp=''] = s.split('.');
    ip = (ip || '0').replace(/^0+(?=\d)/, '');
    const recortado = dp.replace(/0+$/,'').length > 6;
    if (ip.length % 2) ip = '0' + ip;
    const gEnt = ip.match(/../g);
    const gDec = (dp + '000000').slice(0,6).match(/../g);
    const grupos = [...gEnt, ...gDec];
    const verGrupo = (g, i) => i === 0 ? String(Number(g)) : g;

    let r = 0n, p = 0n, filas = [];
    grupos.forEach((g, i) => {
      const c = r*100n + BigInt(g);
      let d = 0n; while ((20n*p + d + 1n)*(d + 1n) <= c) d++;
      const prod = (20n*p + d)*d;
      filas.push({i, g, c, p, d, prod, resto: c - prod});
      r = c - prod; p = p*10n + d;
    });
    const dig = p.toString().padStart(grupos.length, '0');
    const parteEnt = String(Number(dig.slice(0, gEnt.length)));
    const decRaiz = dig.slice(gEnt.length);
    const raiz = (r === 0n && /^0*$/.test(decRaiz)) ? parteEnt : parteEnt + ',' + decRaiz;

    let h = '<ol class="pasos">';
    h += paso('Separa el número en grupos de dos cifras',
      `<p>Empezando en la coma y yendo hacia la izquierda, separamos las cifras de dos en dos. Después de la coma agregamos parejas de ceros: cada pareja nos dará un decimal (aquí ponemos 3 parejas para 3 decimales):</p>
       <p><span class="cuenta">${gEnt.map(verGrupo).join(' ')} , ${gDec.join(' ')}</span></p>
       <p class="pista">¿Por qué de dos en dos? Al multiplicar un número por sí mismo, el resultado tiene más o menos el doble de cifras. Por eso cada grupo de dos cifras da una cifra de la raíz.${recortado ? ' Usamos solo los primeros 6 decimales del número.' : ''}</p>`);
    const f0 = filas[0];
    h += paso('Encuentra la primera cifra',
      `<p>Buscamos el número más grande que, multiplicado por sí mismo, no se pase de ${verGrupo(f0.g,0)} (el primer grupo):</p>
       <p><span class="cuenta">${f0.d} × ${f0.d} = ${f0.prod}</span> &nbsp; ${f0.d+1n} × ${f0.d+1n} = ${(f0.d+1n)*(f0.d+1n)} ya se pasa</p>
       <p>La primera cifra de la raíz es <strong>${f0.d}</strong>. Ahora restamos para ver cuánto sobra: ${f0.c} − ${f0.prod} = ${f0.resto}.</p>`);
    const f1 = filas[1];
    const etq = (p, d) => p === 0n ? `${d}` : `${2n*p}${d}`;
    h += paso('Baja el siguiente grupo y duplica',
      `<p>A la derecha de lo que sobró (${f0.resto}) escribimos el siguiente grupo (${f1.g}). Ahora trabajamos con <strong>${f1.c}</strong>.</p>
       <p>Multiplicamos por 2 lo que llevamos de raíz: 2 × ${f1.p} = ${2n*f1.p}. Ahora buscamos una cifra ▢ para completar esta multiplicación sin pasarnos de ${f1.c}:</p>
       <p><span class="cuenta">${2n*f1.p}▢ × ▢</span></p>
       <p class="pista">La misma cifra va en los dos cuadritos. Probamos cifras hasta encontrar la más grande que no se pase:</p>
       <p><span class="cuenta">${etq(f1.p,f1.d)} × ${f1.d} = ${f1.prod}</span> &nbsp; ${f1.d < 9n ? `${etq(f1.p,f1.d+1n)} × ${f1.d+1n} = ${(20n*f1.p+f1.d+1n)*(f1.d+1n)} ya se pasa` : ''}</p>
       <p>La siguiente cifra de la raíz es <strong>${f1.d}</strong>. Restamos: ${f1.c} − ${f1.prod} = ${f1.resto}.</p>`);
    const filasHtml = filas.map((f, i) => {
      const dec = i === gEnt.length ? ' (empiezan los decimales)' : '';
      return `<tr><td>${i+1}</td><td>${f.c}</td><td>${i === 0 ? '—' : (2n*f.p).toString()}</td><td>${etq(f.p,f.d)} × ${f.d} = ${f.prod}</td><td>${f.resto}</td><td class="izq"><strong>${f.d}</strong>${dec}</td></tr>`;
    }).join('');
    h += paso('Repite con cada grupo',
      `<p>Repetimos los mismos pasos con cada grupo: bajar el grupo, multiplicar por 2 la raíz que llevamos y buscar la cifra ▢. Cuando empezamos con los grupos de después de la coma, también ponemos la coma en la raíz.</p>
       <div class="tabla"><table><thead><tr><th>Vuelta</th><th>Trabajas con</th><th>Doble de la raíz</th><th>Prueba</th><th>Sobra</th><th>Cifra</th></tr></thead>
       <tbody>${filasHtml}</tbody></table></div>
       <p>Juntando las cifras: <strong>${raiz}</strong>.</p>
       <p class="pista">Este método cuesta un poco al principio. Ayuda mucho seguirlo con lápiz y papel, renglón por renglón.</p>`);
    h += '</ol>';
    const exacta = r === 0n && !recortado;
    return h + resultado(n, raiz, exacta ? '=' : '≈',
      exacta ? '<div class="pista">No sobró nada: la raíz es exacta.</div>' : '<div class="pista">Estos decimales son correctos, sin redondear. Si agregas más parejas de ceros, obtienes más decimales.</div>');
  }

  function factorizacion(n){
    if (!Number.isInteger(n)){
      return '<ol class="pasos">' + paso('Este método es para números enteros',
        `<p>${fmt(n)} tiene decimales, y la factorización en primos solo funciona con números enteros. Elige otro método de la lista.</p>`, 'aviso') + '</ol>';
    }
    if (n < 2) return htmlPerfecto(n, n);
    let m = n, filas = '', factores = [], d = 2;
    while (m > 1 && d*d <= m){
      while (m % d === 0){ filas += `<tr><td>${m}</td><td>${d}</td></tr>`; factores.push(d); m /= d; }
      d += d === 2 ? 1 : 2;
    }
    if (m > 1){ filas += `<tr><td>${m}</td><td>${m}</td></tr>`; factores.push(m); }
    filas += `<tr><td>1</td><td></td></tr>`;

    let h = '<ol class="pasos">';
    h += paso('Descompón en factores primos',
      `<p>Un número primo solo se puede dividir exacto entre 1 y entre sí mismo: 2, 3, 5, 7, 11, 13… Dividimos ${n} entre el primo más pequeño que se pueda, y repetimos con el resultado hasta llegar a 1:</p>
       <div class="tabla"><table style="width:auto"><thead><tr><th>Número</th><th>Entre</th></tr></thead><tbody>${filas}</tbody></table></div>
       <p><span class="cuenta">${n} = ${factores.join(' × ')}</span></p>`);

    if (factores.length === 1){
      h += paso('¿Se puede simplificar?',
        `<p>${n} es un número primo: solo se divide entre 1 y entre sí mismo. No hay parejas de factores, así que √${n} no se puede simplificar.</p>
         <p class="pista">Para saber cuánto vale, usa otro método de la lista, por ejemplo el babilónico.</p>`, 'aviso') + '</ol>';
      return h + resultado(n, '√' + n, '=', `<div class="pista">Su valor aproximado es ${fmt(Math.sqrt(n),4)}.</div>`);
    }
    const cuenta = {}; factores.forEach(f => cuenta[f] = (cuenta[f]||0) + 1);
    let fuera = 1, dentro = 1, parejas = [], solos = [];
    Object.keys(cuenta).map(Number).forEach(f => {
      const e = cuenta[f];
      for (let i = 0; i < Math.floor(e/2); i++){ parejas.push(`(${f} × ${f})`); fuera *= f; }
      if (e % 2){ solos.push(f); dentro *= f; }
    });
    const agrupado = [...parejas, ...solos].join(' × ');
    const salen = Object.keys(cuenta).map(Number).flatMap(f => Array(Math.floor(cuenta[f]/2)).fill(f));
    h += paso('Agrupa los factores en parejas',
      `<p>Buscamos parejas de números iguales. Cada pareja <strong>sale de la raíz como un solo número</strong>, porque, por ejemplo, √(3 × 3) = √9 = 3. Los que no tienen pareja se quedan dentro:</p>
       <p><span class="cuenta">√${n} = √(${agrupado})</span></p>
       <p>${parejas.length ? `Salen: ${salen.join(' × ')} = ${fuera}.` : 'No hay parejas, así que nada sale de la raíz.'}
       ${solos.length ? `Se quedan dentro sin pareja: ${solos.join(' × ')} = ${dentro}.` : 'No queda nada dentro.'}</p>`);
    const valor = dentro === 1 ? String(fuera) : (fuera === 1 ? `√${dentro}` : `${fuera}√${dentro}`);
    h += '</ol>';
    return h + resultado(n, valor, '=',
      dentro === 1 ? '<div class="pista">Todas las parejas salieron: la raíz es exacta.</div>'
                   : `<div class="pista">Es la forma simplificada. Como número decimal vale aproximadamente ${fmt(Math.sqrt(n),4)}.</div>`);
  }

  function aproximacion(n){
    const p = esPerfecto(n); if (p !== null) return htmlPerfecto(n, p);
    const a = Math.floor(Math.sqrt(n)), b = a+1;
    let c = (n - a*a) <= (b*b - n) ? a : b;
    if (c === 0) c = 1;
    const dif = n - c*c, x = c + dif / (2*c);
    let h = '<ol class="pasos">' + pasoVecinos(n);
    h += paso('Elige el cuadrado más cercano',
      `<p>${fmt(n)} está más cerca de <strong>${c*c} = ${c}²</strong>${c === 1 && a === 0 ? ' (usamos 1 porque con 0 no se puede dividir)' : ''}. La diferencia es:</p>
       <p><span class="cuenta">${fmt(n)} − ${c*c} = ${fmt(dif)}</span></p>${dif < 0 ? `<p class="pista">Sale negativa porque ${fmt(n)} es menor que ${c*c}: la raíz será un poco menos que ${c}.</p>` : ''}`);
    h += paso('Aplica la fórmula',
      `<p>La fórmula es:</p>
       <p><span class="cuenta">raíz ≈ número cercano + diferencia ÷ (2 × número cercano)</span></p>
       <p>Con nuestros números:</p>
       <p><strong>Primero la división:</strong> la diferencia entre el doble de ${c}.<br><span class="cuenta">${fmt(dif)} ÷ ${2*c} = ${fmt(dif/(2*c),4)}</span></p>
       <p><strong>Después la suma:</strong><br><span class="cuenta">${c} ${dif < 0 ? '−' : '+'} ${fmt(Math.abs(dif/(2*c)),4)} ≈ ${fmt(x,4)}</span></p>
       <p class="pista">Primero se divide y después se suma, porque las divisiones van antes que las sumas.</p>
       <p class="pista">¿Por qué funciona? Si a ${c} le sumas o le quitas un poquito y lo multiplicas por sí mismo, el resultado cambia más o menos ${2*c} veces ese poquito (el doble de ${c}). Por eso, para saber cuánto mover el ${c}, dividimos la diferencia entre ${2*c}.</p>`);
    h += pasoComprobar(n, x);
    const err = Math.abs(x - Math.sqrt(n));
    h += paso('¿Qué tan buena es?',
      `<p>Comparado con la calculadora, nos equivocamos por solo ${fmt(err,4)}.</p>
       <p class="pista">Funciona mejor cuanto más cerca está el número de un cuadrado perfecto. Si repites la fórmula usando el resultado como nuevo número cercano, estás haciendo el método babilónico.</p>`);
    h += '</ol>';
    return h + resultado(n, fmt(x,4), '≈');
  }

  function geometrico(n){
    const W = 340, x0 = 30, s = W/(n+1), R = W/2, y = R + 30;
    const A = x0, C = x0 + n*s, B = x0 + W, hpx = Math.sqrt(n)*s, xc = x0 + R;
    const svg = `<div class="dibujo"><svg viewBox="0 0 400 ${y+40}" role="img" aria-label="Semicircunferencia con la altura que mide la raíz de ${fmt(n)}">
      <path d="M ${A} ${y} A ${R} ${R} 0 0 1 ${B} ${y}" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
      <line x1="${A}" y1="${y}" x2="${B}" y2="${y}" stroke="currentColor" stroke-width="3"/>
      <line x1="${C}" y1="${y}" x2="${C}" y2="${y-hpx}" style="stroke:var(--pen)" stroke-width="4"/>
      <circle cx="${xc}" cy="${y}" r="3" fill="currentColor"/>
      <circle cx="${C}" cy="${y-hpx}" r="5" style="fill:var(--pen)"/>
      <text x="${A}" y="${y+22}" text-anchor="middle" fill="currentColor" font-size="15">A</text>
      <text x="${C}" y="${y+22}" text-anchor="middle" fill="currentColor" font-size="15">C</text>
      <text x="${B}" y="${y+22}" text-anchor="middle" fill="currentColor" font-size="15">B</text>
      <text x="${(A+C)/2}" y="${y+38}" text-anchor="middle" fill="currentColor" font-size="13">${fmt(n)}</text>
      <text x="${C-8}" y="${y-hpx/2}" text-anchor="end" style="fill:var(--pen)" font-size="15" font-weight="700">√${fmt(n)}</text>
    </svg></div>`;
    let h = '<ol class="pasos">';
    h += paso('Dibuja la base',
      `<p>Con la regla, dibuja una línea recta AC que mida ${fmt(n)} unidades (pueden ser centímetros o cuadritos). Sin cambiar de dirección, alárgala 1 unidad más hasta B. En total, AB mide ${fmt(n+1)}.</p>`);
    h += paso('Traza media circunferencia',
      `<p>Marca la mitad de AB. Pon ahí la punta del compás y ábrelo hasta A. Traza media circunferencia que vaya de A a B (su radio es ${fmt((n+1)/2)}).</p>`);
    h += paso('Sube una línea recta desde C',
      `<p>Desde el punto C, traza una línea recta hacia arriba que forme una esquina perfecta (ángulo de 90°) con AB. Detente donde toque la curva.</p>${svg}
       ${n > 60 ? '<p class="pista">Con números grandes el segmento de 1 unidad se ve muy pequeño, pero la idea es la misma.</p>' : ''}`);
    h += paso('Mide la perpendicular',
      `<p>Esa línea roja mide exactamente √${fmt(n)}. ¿Por qué? Hay una regla de geometría (el teorema de la altura) que dice que, en este dibujo, la línea roja multiplicada por sí misma es igual a los dos pedazos de la base multiplicados:</p>
       <p><span class="cuenta">línea × línea = ${fmt(n)} × 1 = ${fmt(n)}</span></p>
       <p>Y el número que multiplicado por sí mismo da ${fmt(n)} es justamente √${fmt(n)}.</p>
       <p class="pista">Es un método exacto en teoría; en la práctica la precisión depende de qué tan bien midas con la regla.</p>`);
    h += '</ol>';
    return h + resultado(n, fmt(Math.sqrt(n),2), '≈', '<div class="pista">Es lo que medirías con una regla en un dibujo preciso.</div>');
  }

  const METODOS = {babilonico, tanteo, impares, tradicional, factorizacion, aproximacion, geometrico};

  function calcular(){
    const metodo = $('#metodo').value;
    $('#desc').textContent = DESC[metodo];
    const raw = $('#num').value.trim().replace(',', '.');
    const out = $('#salida');
    const n = Number(raw);
    if (raw === '' || !isFinite(n)){
      out.innerHTML = `<p class="error">Escribe un número, por ejemplo 59 o 2,5.</p>`; return;
    }
    if (n < 0){
      out.innerHTML = `<p class="error">Los números negativos no tienen raíz cuadrada real: ningún número multiplicado por sí mismo da un resultado negativo.</p>`; return;
    }
    if (n > 1e12){
      out.innerHTML = `<p class="error">Usa un número menor que un billón para que los pasos se puedan seguir.</p>`; return;
    }
    out.innerHTML = METODOS[metodo](n, raw);
  }

  $('#calc').addEventListener('click', calcular);
  $('#metodo').addEventListener('change', calcular);
  $('#num').addEventListener('keydown', e => { if (e.key === 'Enter') calcular(); });
  document.querySelectorAll('.ejemplos button').forEach(btn =>
    btn.addEventListener('click', () => { $('#num').value = btn.dataset.v; calcular(); }));
  calcular();
})();
</script>
</body>
</html>
